# New, standalone Apache vhost for the admin backend - does not modify or
# replace any existing vhost file already on the server. Deliberately just
# the plain HTTP (port 80) proxy: Certbot's Apache plugin (see deploy/README.md)
# detects this vhost by ServerName, issues the cert, and adds the HTTPS
# (443) vhost + HTTP-to-HTTPS redirect on its own - safer than hand-writing
# certificate file paths that could be wrong and stop Apache from starting.
<VirtualHost *:80>
    ServerName manage.shopq.lk

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/

    ErrorLog ${APACHE_LOG_DIR}/manage.shopq.lk-error.log
    CustomLog ${APACHE_LOG_DIR}/manage.shopq.lk-access.log combined
</VirtualHost>
